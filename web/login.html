<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Eva Finance</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f0c29 0%, #1a1a3e 50%, #24243e 100%);
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
    }

    /* Ambient orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.25;
      pointer-events: none;
      animation: drift 12s ease-in-out infinite alternate;
    }
    .orb-1 {
      width: 400px; height: 400px;
      background: #6c63ff;
      top: -100px; left: -100px;
      animation-delay: 0s;
    }
    .orb-2 {
      width: 300px; height: 300px;
      background: #a855f7;
      bottom: -80px; right: -80px;
      animation-delay: -4s;
    }
    .orb-3 {
      width: 200px; height: 200px;
      background: #3b82f6;
      top: 50%; left: 60%;
      animation-delay: -8s;
    }

    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(30px, 20px) scale(1.08); }
    }

    /* Card */
    .card {
      position: relative;
      width: 380px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 44px 40px 40px;
      box-shadow:
        0 32px 64px rgba(0,0,0,0.4),
        inset 0 1px 0 rgba(255,255,255,0.1);
    }

    /* Logo / Avatar area */
    .logo-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 32px;
    }
    .avatar-ring {
      width: 72px; height: 72px;
      border-radius: 18px;
      background: #16a34a;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 14px;
      box-shadow: 0 0 32px rgba(22,163,74,0.5);
    }
    .avatar-ring svg {
      width: 38px; height: 38px;
      fill: white;
    }
    .logo-wrap h1 {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.3px;
    }
    .logo-wrap p {
      font-size: 13px;
      color: rgba(255,255,255,0.45);
      margin-top: 4px;
    }

    /* Form */
    .field {
      margin-bottom: 16px;
    }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 8px;
    }
    .field input {
      width: 100%;
      padding: 13px 16px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
    }
    .field input::placeholder { color: rgba(255,255,255,0.25); }
    .field input:focus {
      border-color: rgba(22,163,74,0.7);
      background: rgba(255,255,255,0.1);
      box-shadow: 0 0 0 3px rgba(22,163,74,0.2);
    }

    /* Error */
    .error-msg {
      display: none;
      align-items: center;
      gap: 8px;
      background: rgba(239,68,68,0.15);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 16px;
      font-size: 13px;
      color: #fca5a5;
    }
    .error-msg.show { display: flex; }

    /* Button */
    .btn-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #16a34a, #22c55e);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 4px 20px rgba(22,163,74,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-login:hover:not(:disabled) {
      opacity: 0.92;
      transform: translateY(-1px);
      box-shadow: 0 8px 28px rgba(22,163,74,0.5);
    }
    .btn-login:active:not(:disabled) { transform: translateY(0); }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }

    /* Spinner */
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .footer-note {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: rgba(255,255,255,0.25);
    }
  </style>
</head>
<body>

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="card">
    <div class="logo-wrap">
      <div class="avatar-ring">
        <!-- Chat bubble icon — sama dengan brand sidebar -->
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/>
        </svg>
      </div>
      <h1>Eva Finance</h1>
      <p>Holomoc Indonesia — Internal Access</p>
    </div>

    <div class="error-msg" id="errorMsg">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
      </svg>
      <span id="errorText">Username atau password salah.</span>
    </div>

    <div class="field">
      <label for="username">Username</label>
      <input
        type="text"
        id="username"
        placeholder="Masukkan username"
        autocomplete="username"
        autofocus
      />
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Masukkan password"
        autocomplete="current-password"
      />
    </div>

    <button class="btn-login" id="btnLogin" onclick="doLogin()">
      <div class="spinner" id="spinner"></div>
      <span id="btnText">Masuk</span>
    </button>

    <div class="footer-note">Holomoc AI Ecosystem © 2026</div>
  </div>

  <script>
    // Jika sudah punya token valid, langsung ke app
    const existing = localStorage.getItem('eva_token');
    if (existing) {
      window.location.href = '/';
    }

    // Enter key submit
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });

    async function doLogin() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const btn      = document.getElementById('btnLogin');
      const spinner  = document.getElementById('spinner');
      const btnText  = document.getElementById('btnText');
      const errorMsg = document.getElementById('errorMsg');
      const errorTxt = document.getElementById('errorText');

      if (!username || !password) {
        showError('Username dan password wajib diisi.');
        return;
      }

      // Loading state
      btn.disabled    = true;
      spinner.style.display = 'block';
      btnText.textContent   = 'Memverifikasi...';
      errorMsg.classList.remove('show');

      try {
        const res = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (!res.ok) {
          showError(data.detail || 'Login gagal. Coba lagi.');
          return;
        }

        // Simpan token + info user
        localStorage.setItem('eva_token', data.token);
        localStorage.setItem('eva_username', data.username);
        localStorage.setItem('eva_role', data.role);

        // Redirect ke app
        window.location.href = '/';

      } catch (err) {
        showError('Tidak dapat terhubung ke server.');
      } finally {
        btn.disabled          = false;
        spinner.style.display = 'none';
        btnText.textContent   = 'Masuk';
      }
    }

    function showError(msg) {
      document.getElementById('errorText').textContent = msg;
      document.getElementById('errorMsg').classList.add('show');
    }
  </script>
</body>
</html>
